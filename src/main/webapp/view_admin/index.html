<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quầy Bán Hàng - Áo Sơ Mi Admin</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">
    <h2>Quản Lý Bán Hàng</h2>
    <button class="btn btn-primary mb-3" id="addInvoiceBtn">Thêm Hóa Đơn</button>
    
    <!-- Nav tabs -->
    <ul class="nav nav-tabs" id="invoiceTabs" role="tablist">
        <li class="nav-item">
            <a class="nav-link active" id="invoice-1-tab" data-toggle="tab" href="#invoice-1" role="tab" aria-controls="invoice-1" aria-selected="true">Hóa Đơn 1</a>
        </li>
    </ul>

    <!-- Tab content -->
    <div class="tab-content" id="invoiceTabsContent">
        <div class="tab-pane fade show active" id="invoice-1" role="tabpanel" aria-labelledby="invoice-1-tab">
            <!-- Nội dung hóa đơn 1 -->
            <div class="row mt-3">
                <div class="col-md-8">
                    <h4>Danh Sách Sản Phẩm</h4>
                    <div class="form-row">
                        <div class="form-group col-md-3">
                            <input type="text" class="form-control" placeholder="Tìm kiếm sản phẩm">
                        </div>
                        <div class="form-group col-md-2">
                            <select class="form-control">
                                <option value="">Màu sắc</option>
                                <option value="red">Đỏ</option>
                                <option value="blue">Xanh</option>
                            </select>
                        </div>
                        <div class="form-group col-md-2">
                            <select class="form-control">
                                <option value="">Chất liệu</option>
                                <option value="cotton">Cotton</option>
                                <option value="polyester">Polyester</option>
                            </select>
                        </div>
                        <div class="form-group col-md-2">
                            <select class="form-control">
                                <option value="">Kiểu tay</option>
                                <option value="short">Ngắn</option>
                                <option value="long">Dài</option>
                            </select>
                        </div>
                        <div class="form-group col-md-2">
                            <select class="form-control">
                                <option value="">Kích cỡ</option>
                                <option value="S">S</option>
                                <option value="M">M</option>
                                <option value="L">L</option>
                            </select>
                        </div>
                        <div class="form-group col-md-1">
                            <button class="btn btn-secondary">Làm Mới</button>
                        </div>
                    </div>

                    <table class="table table-bordered">
                        <thead>
                        <tr>
                            <th>STT</th>
                            <th>Hình Ảnh</th>
                            <th>Tên Sản Phẩm</th>
                            <th>Giá Bán</th>
                            <th>Số Lượng</th>
                            <th>Kích Thước</th>
                            <th>Màu Sắc</th>
                            <th>Trạng Thái</th>
                            <th>Hành Động</th>
                        </tr>
                        </thead>
                        <tbody>
                        <!-- Add products here -->
                        </tbody>
                    </table>
                </div>

                <!-- Giỏ hàng -->
                <div class="col-md-4">
                    <h4>Giỏ Hàng</h4>
                    <table class="table table-bordered">
                        <thead>
                        <tr>
                            <th>STT</th>
                            <th>Sản Phẩm</th>
                            <th>Tổng Tiền</th>
                            <th>Số Lượng</th>
                            <th>Thao Tác</th>
                        </tr>
                        </thead>
                        <tbody>
                        <!-- Add cart items here -->
                        </tbody>
                    </table>

                    <div class="form-group">
                        <label for="customerAccount">Tài Khoản Khách Hàng</label>
                        <input type="text" class="form-control" id="customerAccount">
                    </div>

                    <div class="form-group">
                        <label for="discountCode">Mã Giảm Giá</label>
                        <input type="text" class="form-control" id="discountCode">
                        <button class="btn btn-primary mt-2">Chọn Mã Giảm Giá</button>
                    </div>

                    <div class="form-group">
                        <button class="btn btn-success">Giao Hàng</button>
                    </div>

                    <div class="form-group">
                        <label for="totalPrice">Tiền Hàng</label>
                        <input type="text" class="form-control" id="totalPrice" readonly>
                    </div>

                    <div class="form-group">
                        <label for="discountAmount">Giảm Giá</label>
                        <input type="text" class="form-control" id="discountAmount" readonly>
                    </div>

                    <div class="form-group">
                        <label for="finalPrice">Thanh Toán</label>
                        <input type="text" class="form-control" id="finalPrice" readonly>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
